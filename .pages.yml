# Configuración del panel de edición (Pages CMS: https://app.pagescms.org)
media:
  input: img/fotos
  output: img/fotos
  extensions: [jpg, jpeg, png, webp]

content:
  - name: secciones
    label: Secciones y fotos
    description: "Cada sección aparece en Servicios, en los filtros del Portfolio y en el formulario de contacto. El orden de la lista es el orden en la página."
    type: file
    path: contenido/secciones.json
    format: json
    fields:
      - name: secciones
        label: Secciones
        type: object
        list: true
        fields:
          - name: titulo
            label: Título
            type: string
            required: true
          - name: subtitulo
            label: Subtítulo (texto corto debajo del título)
            type: string
          - name: portada
            label: Foto de la tarjeta en Servicios
            description: "Si la dejás vacía, se usa la primera foto de la sección."
            type: image
          - name: fotos
            label: Fotos
            description: "Podés subir varias juntas y arrastrarlas para cambiar el orden. Cada foto tiene que pesar MENOS DE 4 MB: exportalas a 3000 px del lado largo, calidad 85-90. Si alguna pesa más, subila desde GitHub (img/fotos → Add file → Upload files) y después elegila acá."
            type: image
            options:
              multiple: true

  - name: sitio
    label: Portada, Sobre mí y contacto
    type: file
    path: contenido/sitio.json
    format: json
    fields:
      - name: portada
        label: Portada (lo primero que se ve)
        type: object
        fields:
          - { name: foto, label: Foto de fondo, type: image }
          - { name: descripcion_foto, label: "Descripción de la foto (para Google y lectores de pantalla)", type: string }
          - { name: sobretitulo, label: Texto chico de arriba, type: string }
          - { name: titulo, label: Título, type: string }
          - { name: titulo_destacado, label: "Segunda línea del título (en dorado)", type: string }
          - { name: subtitulo, label: Texto debajo del título, type: string }
      - name: sobre_mi
        label: Sobre mí
        type: object
        fields:
          - { name: foto, label: Tu foto, type: image }
          - { name: titulo, label: Título, type: string }
          - name: texto
            label: Texto
            description: "Dejá una línea en blanco para separar párrafos."
            type: text
      - name: otros_eventos
        label: Tarjeta de otros eventos (en Servicios)
        type: object
        fields:
          - { name: titulo, label: Título, type: string }
          - { name: texto, label: Texto, type: string }
      - name: contacto
        label: Contacto
        type: object
        fields:
          - name: whatsapp
            label: WhatsApp
            description: "Con código de país, sin + ni espacios. Ej: 5491173629233"
            type: string
          - name: instagram
            label: Usuario de Instagram (sin @)
            type: string
